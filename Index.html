<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter Readability Check</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--mut:#6b665e;--card:#fff;--bd:#e3ded4;--ac:#8a3b12;--hl:#ffd98a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1916;--fg:#ece7de;--mut:#a39d91;--card:#25221e;--bd:#3a352f;--ac:#f0a06a;--hl:#7a5a12}}
:root[data-theme="dark"]{--bg:#1b1916;--fg:#ece7de;--mut:#a39d91;--card:#25221e;--bd:#3a352f;--ac:#f0a06a;--hl:#7a5a12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.7rem;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 16px;font-family:system-ui,sans-serif;font-size:.95rem}
textarea{width:100%;min-height:200px;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;resize:vertical}
button{margin-top:10px;padding:10px 18px;border:0;border-radius:8px;background:var(--ac);color:var(--bg);font:600 1rem system-ui,sans-serif;cursor:pointer}
button.alt{background:transparent;color:var(--mut);border:1px solid var(--bd);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font-family:system-ui,sans-serif}
.stat b{display:block;font-size:1.5rem}
.stat span{color:var(--mut);font-size:.8rem}
.verdict{font-family:system-ui,sans-serif;margin:0 0 16px}
.text{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:1px 0}
mark sup{font:700 .7rem system-ui,sans-serif;color:var(--ac);margin-left:2px}
ol{padding-left:20px}
li{margin-bottom:10px}
li small{display:block;color:var(--mut);font-family:system-ui,sans-serif}
h2{font-size:1.15rem;margin:24px 0 8px}
[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>Chapter Readability Check</h1>
<p class="sub">Paste a chapter. Get a readability score and your five hardest sentences. Nothing leaves your browser.</p>
<textarea id="in" placeholder="Paste your chapter here…"></textarea>
<div><button id="go">Check readability</button><button class="alt" id="clr">Clear</button></div>
<section id="out" hidden>
<div class="grid" id="stats"></div>
<p class="verdict" id="verdict"></p>
<h2>Your text, hardest sentences marked</h2>
<div class="text" id="marked"></div>
<h2>The five hardest sentences</h2>
<ol id="list"></ol>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const ABBR=/\b(mr|mrs|ms|dr|prof|st|sr|jr|vs|etc|e\.g|i\.e)$/i;
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function syl(w){
  w=w.toLowerCase().replace(/[^a-z]/g,"");
  if(!w)return 0; if(w.length<=3)return 1;
  w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,"").replace(/^y/,"");
  const m=w.match(/[aeiouy]{1,2}/g);
  return Math.max(1,m?m.length:1);
}
function words(s){return s.match(/[A-Za-z0-9'’-]+/g)||[]}
function split(t){
  const out=[];let start=0;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(c==="."||c==="!"||c==="?"){
      let j=i+1;
      while(j<t.length&&/["”’')\]]|[.!?]/.test(t[j]))j++;
      const before=t.slice(start,i);
      const next=t.slice(j).match(/^\s*(.?)/)[1];
      if(c==="."&&(ABBR.test(before)||(next&&/[a-z0-9]/.test(next)&&!/\s/.test(t[j]||"")))){i=j-1;continue}
      if(j<t.length&&!/\s/.test(t[j])){i=j-1;continue}
      out.push([start,j]);start=j;i=j-1;
    } else if(c==="\n"&&t[i+1]==="\n"){
      if(t.slice(start,i).trim())out.push([start,i]);
      start=i;
    }
  }
  if(t.slice(start).trim())out.push([start,t.length]);
  return out;
}
function analyze(){
  const t=$("in").value;
  const spans=split(t).map(([a,b])=>{
    const s=t.slice(a,b),w=words(s),sy=w.reduce((n,x)=>n+syl(x),0);
    const score=w.length?0.39*w.length+11.8*sy/w.length-15.59:0;
    return{a,b,s:s.trim(),n:w.length,sy,score};
  }).filter(x=>x.n>0);
  const W=spans.reduce((n,x)=>n+x.n,0),S=spans.length,Y=spans.reduce((n,x)=>n+x.sy,0);
  if(!W||!S){$("out").hidden=true;return}
  const ease=206.835-1.015*(W/S)-84.6*(Y/W);
  const grade=0.39*(W/S)+11.8*(Y/W)-15.59;
  const top=spans.filter(x=>x.n>=4).sort((x,y)=>y.score-x.score).slice(0,5);
  const ranks=new Map(top.map((x,i)=>[x.a,i+1]));
  let html="",pos=0;
  for(const x of spans.slice().sort((p,q)=>p.a-q.a)){
    if(ranks.has(x.a)){
      let a=x.a;while(/\s/.test(t[a]))a++;
      let b=x.b;while(b>a&&/\s/.test(t[b-1]))b--;
      html+=esc(t.slice(pos,a))+'<mark>'+esc(t.slice(a,b))+'<sup>'+ranks.get(x.a)+'</sup></mark>';
      pos=b;
    }
  }
  html+=esc(t.slice(pos));
  const band=ease>=80?"Easy. Fast, light reading.":ease>=60?"Plain English. Suits most general fiction and nonfiction.":ease>=50?"Fairly difficult. Fine for literary or academic work.":"Difficult. Expect readers to slow down.";
  $("stats").innerHTML=[[ease.toFixed(0),"Flesch Reading Ease"],[grade.toFixed(1),"Grade level"],[W.toLocaleString(),"Words"],[S.toLocaleString(),"Sentences"],[(W/S).toFixed(1),"Avg words / sentence"]]
    .map(([v,l])=>'<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>').join("");
  $("verdict").textContent=band;
  $("marked").innerHTML=html;
  $("list").innerHTML=top.map(x=>'<li>'+esc(x.s)+'<small>'+x.n+' words · grade '+x.score.toFixed(1)+'</small></li>').join("")||"<li>No sentences long enough to rank.</li>";
  $("out").hidden=false;
  $("out").scrollIntoView({behavior:"smooth"});
}
$("go").onclick=analyze;
$("clr").onclick=()=>{$("in").value="";$("out").hidden=true};
</script>
</body>
</html>
